<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo HUMG</title>
    <style>
        body{
            

        }
        .menu{
            background-color:#2fa4e7;
           
        }
        .danh-sach-muc{
            list-style:none;
            display:flex;
            font-weight:bold;
            margin:0;
        }
        .muc{
            padding:10px;
        }
        a{
            color:white;
            /* để bỏ gạch chân thẻ a */
            text-decoration: none;
        }
        main{
            display:flex;
        }
        .khoi-trai{
            width:20%;
            height:300px;
        }
        .khoi-phai{
            background-color:green;
            width:80%;
            height:300px;
        }
        
        .dang-nhap{
            width: 100%;
            margin: 0;
           
        }
        .khoi{
            margin: 1px; 
            width: 95%;
            
        }
        form{
            width:100%;
        }

    </style>
</head>
<body>
    <!-- Danh mục -->
    <nav class="menu"><!--Thanh menu -->
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#">Thực tập, Đồ án</a></li>
            <li class="muc"><a href="#">Thủ tục Một Cửa</a></li>
            <li class="muc"><a href="#">Một Cửa online</a></li>
            <li class="muc"><a href="#">E-mail HUMG</a></li>
        </ul>
    </nav>
    <main>
        <div class="khoi-trai">
            <div class="dang-nhap">
                <form action="">
                    <div >
                        <p class="khoi">Tài khoản</p>
                        <input type="text" style="width:90%;">
                
                        <p class="khoi">Mật khẩu</p>
                        <input type="passwork" style="width:90%;">
                    </div>
                    <div>
                        <button class="khoi">Đăng nhập</button>
                   
                        <button class="khoi">Mật khẩu</button>
                    </div>
                </form>   
            </div>
            <div>LOGO</div>
        </div>
        <div class="khoi-phai">
            Phải
        </div>
    </main>
</body>
</html>
